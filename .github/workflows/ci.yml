name: CI

on:
  push:
  pull_request:

jobs:
  smoke-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install built wheel
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          Path("wheel_path.txt").write_text(str(wheels[0]))
          PY
          python -m pip install "mosaic[test] @ file://$PWD/$(cat wheel_path.txt)"
          python -m pip check

      - name: Import/version smoke
        run: |
          python - <<'PY'
          import core
          print(core.__version__)
          PY

      - name: CLI help/version
        run: |
          mosaic --help
          mosaic --version

      - name: Canonical example smoke
        run: |
          MOSAIC_SMOKE_USE_INSTALLED=1 python scripts/smoke_example.py

      - name: Guard rails
        run: |
          python scripts/ci_ast_check.py

      - name: Unit tests
        run: |
          pytest -q tests/unit

      - name: Integration tests
        run: |
          pytest --timeout=180 -q tests/integration

      - name: CUDA extra resolution and admission gate
        run: |
          python -m pip install "mosaic[test,cuda12] @ file://$PWD/$(cat wheel_path.txt)"
          pytest -q tests/unit/runtime/test_gpu_admission.py
